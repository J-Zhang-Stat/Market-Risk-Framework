[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-risk-framework"
version = "0.1.0"
description = "Multi-asset portfolio market risk framework with factor exposures, VaR backtesting, stress testing, and risk-aware rebalancing."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
market-data = ["yfinance>=0.2"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

